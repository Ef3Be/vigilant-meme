<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuel Çözümleme — RSA Kriptografik Belge ve Doğrulama Sistemi</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f6;
            color: #1f2937;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .portal-wrapper {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border: 1px solid #d1d9e0;
            border-top: 5px solid #0b3c6d;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(11, 60, 109, 0.08);
            overflow: hidden;
        }
        .portal-header {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 18px 28px;
        }
        .portal-kicker {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.1px;
            color: #0b3c6d;
            margin-bottom: 4px;
        }
        .portal-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .portal-body {
            padding: 26px 28px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            min-height: 100px;
            padding: 11px 13px;
            font-family: Consolas, monospace;
            font-size: 13px;
            color: #0f172a;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #0b3c6d;
            box-shadow: 0 0 0 3px rgba(11, 60, 109, 0.12);
        }
        button {
            margin-top: 14px;
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #0b3c6d;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #082c50;
        }
        .alert-error {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 4px;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 13px;
            font-weight: 600;
        }
        .result-box {
            margin-top: 18px;
            padding: 15px;
            border-radius: 4px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
        }
        .result-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #166534;
            margin-bottom: 6px;
        }
        .result-text {
            font-size: 17px;
            font-weight: 700;
            color: #14532d;
            word-break: break-all;
            font-family: Consolas, monospace;
        }
        .portal-footer {
            padding: 14px 28px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .portal-footer a {
            color: #0b3c6d;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="portal-wrapper">
        <div class="portal-header">
            <div class="portal-kicker">RSA Kriptografik Belge ve Doğrulama Sistemi</div>
            <h1 class="portal-title">Manuel Şifre Çözücü</h1>
        </div>

        <div class="portal-body">
            <form method="POST">
                <label for="cipher_text">Şifrelenmiş Metin veya Zaman Damgalı Paket</label>
                <textarea
                    id="cipher_text"
                    name="cipher_text"
                    placeholder="Örneğin: 1234-5678-9101|1795720000"
                    required
                >{{ cipher_input }}</textarea>
                <button type="submit">Şifrelenmiş Metni Çöz</button>
            </form>

            {% if status_error %}
            <div class="alert-error">{{ status_error }}</div>
            {% endif %}

            {% if decrypted_result is not none %}
            <div class="result-box">
                <div class="result-label">Çözümlenen Orijinal Metin</div>
                <div class="result-text">{{ decrypted_result }}</div>
            </div>
            {% endif %}
        </div>

        <div class="portal-footer">
            <span>Modül: Manuel Çözümleme</span>
            <a href="/">&laquo; Karekod Üreticine Dön</a>
        </div>
    </div>
</body>
</html>
