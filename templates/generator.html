<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Kriptografik Sistem</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; border-top: 4px solid #003366; padding: 30px; border-radius: 4px; width: 100%; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #003366; text-align: center; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #003366; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #002244; }
        .result { text-align: center; margin-top: 20px; }
        img { max-width: 180px; border: 1px solid #ddd; padding: 5px; background: #fff; }
        .timer { margin-top: 10px; font-weight: bold; color: #d9534f; }
        .link { display: block; text-align: center; margin-top: 20px; color: #0056b3; text-decoration: none; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>RSA Karekod Üreteci</h2>
        <form method="POST">
            <input type="text" name="plain_text" placeholder="Şifrelenecek veriyi girin..." required autocomplete="off">
            <button type="submit">QR Kod Oluştur</button>
        </form>

        {% if qr_code %}
        <div class="result">
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR Kod">
            <div class="timer" id="timer">Kalan Süre: <span id="time">04:00</span></div>
        </div>

        <script>
            let timeLeft = 240;
            const timerEl = document.getElementById("time");
            const timerContainer = document.getElementById("timer");

            const countdown = setInterval(() => {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                m = m < 10 ? "0" + m : m;
                s = s < 10 ? "0" + s : s;
                timerEl.innerText = m + ":" + s;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerContainer.innerHTML = "Süre Sona Erdi (Geçersiz)";
                }
                timeLeft--;
            }, 1000);
        </script>
        {% endif %}

        <a href="/cozumle" class="link">Manuel Çözümleme Paneline Git</a>
    </div>
</body>
</html>
