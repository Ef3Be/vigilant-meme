<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>CryptoQR - Güvenli Veri Üretici</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 450px;
            text-align: center;
        }
        h2 { margin-bottom: 10px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0369a1; }
        .result-box {
            margin-top: 30px;
            border-top: 1px solid #334155;
            padding-top: 20px;
        }
        .qr-img {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            max-width: 200px;
        }
        .link-box {
            margin-top: 15px;
            word-break: break-all;
            background: #0f172a;
            padding: 10px;
            border-radius: 6px;
            border: 1px dashed #475569;
        }
        .link-box a { color: #38bdf8; text-decoration: none; font-size: 13px; }
        .link-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>CryptoQR Altyapısı</h2>
        <p class="subtitle">Verilerinizi RSA asimetrik şifreleme ile koruma altına alın.</p>
        
        <form method="POST">
            <input type="text" name="text" placeholder="Gizlenecek veriyi yazın..." required autocomplete="off">
            <button type="submit">Güvenli QR ve Bağlantı Üret</button>
        </form>

        {% if qr_code %}
        <div class="result-box">
            <p style="color: #34d399; font-weight: bold; margin-bottom: 5px;">✓ Kriptografik Paket Hazır!</p>
            <img src="data:image/png;base64,{{ qr_code }}" class="qr-img" alt="QR Kod">
            
            <div class="link-box">
                <span style="font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px;">Güvenli Doğrulama Linki:</span>
                <a href="{{ share_url }}" target="_blank">{{ share_url }}</a>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
