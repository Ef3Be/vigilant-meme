<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Güvenli QR & Zaman Aşımı Sistemi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 420px; text-align: center; }
        h2 { color: #38bdf8; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #fff; box-sizing: border-box; font-size: 16px; }
        button { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .qr-container { margin-top: 20px; }
        img { border-radius: 8px; background: #fff; padding: 10px; max-width: 220px; }
        .timer { margin-top: 15px; font-size: 18px; font-weight: bold; color: #facc15; }
        .expired { color: #ef4444; font-weight: bold; }
        .menu-link { display: block; margin-top: 20px; color: #38bdf8; text-decoration: none; font-size: 14px; }
        .menu-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 RSA & Zaman Aşımlı QR</h2>
        <form method="POST">
            <input type="text" name="plain_text" placeholder="Şifrelenecek metni girin..." required autocomplete="off">
            <button type="submit">Güvenli QR Kod Üret</button>
        </form>

        {% if qr_code %}
        <div class="qr-container">
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR Kod">
            <div class="timer" id="timer">Kalan Süre: <span id="time">04:00</span></div>
        </div>
        
        <script>
            // 4 dakika (240 saniye) geri sayım sayacı
            let timeLeft = 240;
            const timerElement = document.getElementById("time");
            const timerContainer = document.getElementById("timer");

            const countdown = setInterval(() => {
                let minutes = Math.floor(timeLeft / 60);
                let seconds = timeLeft % 60;
                
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                
                timerElement.innerText = minutes + ":" + seconds;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerContainer.innerHTML = "<span class='expired'>⚠️ QR Kodun Süresi Doldu! (Geçersiz)</span>";
                }
                timeLeft--;
            }, 1000);
        </script>
        {% endif %}

        <a href="/cozumle" class="menu-link">🔓 Manuel Şifre Çözücü Sayfasına Git</a>
    </div>
</body>
</html>
