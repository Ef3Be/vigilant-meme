<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSA Kriptografik Belge ve Doğrulama Sistemi</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f6;
            color: #1f2937;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .portal-wrapper {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border: 1px solid #d1d9e0;
            border-top: 5px solid #0b3c6d;
            border-radius: 6px;
            box-shadow: 0 8px 24px rgba(11, 60, 109, 0.08);
            overflow: hidden;
        }
        .portal-header {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 18px 28px;
        }
        .portal-kicker {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.1px;
            color: #0b3c6d;
            margin-bottom: 4px;
        }
        .portal-title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
        }
        .portal-body {
            padding: 26px 28px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 11px 13px;
            font-size: 14px;
            color: #0f172a;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #0b3c6d;
            box-shadow: 0 0 0 3px rgba(11, 60, 109, 0.12);
        }
        button {
            margin-top: 14px;
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #0b3c6d;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #082c50;
        }
        .alert-error {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 4px;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            font-size: 13px;
            font-weight: 500;
        }
        .output-box {
            margin-top: 24px;
            padding-top: 22px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }
        .qr-frame {
            display: inline-block;
            padding: 12px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        .qr-frame img {
            display: block;
            width: 184px;
            height: 184px;
        }
        .ttl-status {
            margin-top: 12px;
            font-size: 13px;
            font-weight: 600;
            color: #0b3c6d;
        }
        .ttl-expired {
            color: #b91c1c;
        }
        .link-box {
            margin-top: 14px;
            padding: 12px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: left;
        }
        .link-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #475569;
            margin-bottom: 6px;
        }
        .verify-link {
            display: block;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #0b3c6d;
            word-break: break-all;
            text-decoration: underline;
        }
        .portal-footer {
            padding: 14px 28px;
            background-color: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .portal-footer a {
            color: #0b3c6d;
            text-decoration: none;
            font-weight: 600;
        }
        .portal-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="portal-wrapper">
        <div class="portal-header">
            <div class="portal-kicker">RSA Kriptografik Belge ve Doğrulama Sistemi</div>
            <h1 class="portal-title">Güvenli Karekod ve Bağlantı Üretici</h1>
        </div>

        <div class="portal-body">
            <form method="POST">
                <label for="plain_text">Şifrelenecek Kelime veya Metin</label>
                <input
                    id="plain_text"
                    type="text"
                    name="plain_text"
                    placeholder="Örneğin: DOGRULAMA_KODU_2026"
                    required
                    autocomplete="off"
                >
                <button type="submit">Süreli Karekod ve Bağlantı Oluştur</button>
            </form>

            {% if error %}
            <div class="alert-error">{{ error }}</div>
            {% endif %}

            {% if qr_code and verify_url %}
            <div class="output-box">
                <div class="qr-frame">
                    <img src="data:image/png;base64,{{ qr_code }}" alt="Doğrulama Karekodu">
                </div>

                <div class="ttl-status" id="ttl-box">
                    Geçerlilik Süresi: <span id="countdown">04:00</span>
                </div>

                <div class="link-box">
                    <div class="link-label">Doğrulama Bağlantısı (Karekod ile Aynı Hedef)</div>
                    <a class="verify-link" href="{{ verify_url }}">{{ verify_url }}</a>
                </div>
            </div>

            <script>
                let secondsLeft = 240;
                const countdownEl = document.getElementById("countdown");
                const ttlBoxEl = document.getElementById("ttl-box");

                const timer = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft <= 0) {
                        clearInterval(timer);
                        ttlBoxEl.className = "ttl-status ttl-expired";
                        ttlBoxEl.textContent = "Geçerlilik Süresi Doldu (240 Saniye Tamamlandı)";
                        return;
                    }
                    const mins = String(Math.floor(secondsLeft / 60)).padStart(2, "0");
                    const secs = String(secondsLeft % 60).padStart(2, "0");
                    countdownEl.textContent = `${mins}:${secs}`;
                }, 1000);
            </script>
            {% endif %}
        </div>

        <div class="portal-footer">
            <span>Modül: Üretim Birimi</span>
            <a href="/cozumle">Manuel Çözümleme Ekranı &raquo;</a>
        </div>
    </div>
</body>
</html>
